<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Pitch">
<meta name="theme-color" content="#08080b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Pocket Pitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceef2;--surface:#ffffff;--surface2:#f3f4f7;--ink:#111216;--muted:#5d6170;--line:#dcdfe5;--glow:rgba(255,255,255,.95);--card-hi:rgba(255,255,255,.9);--card-sh:0 1px 2px rgba(17,18,22,.06),0 8px 20px rgba(17,18,22,.07);
  --pitch:#2f7d4a;--pitch2:#2a7343;--chalk:rgba(255,255,255,.72);
  --accent:#ffcc1f;--accent-ink:#231a00;--win:#2f8f4e;--draw:#8b9088;--loss:#c8372d;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08080b;--surface:#141418;--surface2:#1c1c22;--ink:#f6f6f8;--muted:#9c9ca8;--line:#2b2b34;--glow:rgba(255,255,255,.08);--card-hi:rgba(255,255,255,.06);--card-sh:0 8px 22px rgba(0,0,0,.32);
    --pitch:#1f5c37;--pitch2:#1b5331;--chalk:rgba(255,255,255,.6);
    --accent:#ffd43b;--accent-ink:#231a00;--win:#43b06a;--draw:#7d857f;--loss:#e0564b;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08080b;--surface:#141418;--surface2:#1c1c22;--ink:#f6f6f8;--muted:#9c9ca8;--line:#2b2b34;--glow:rgba(255,255,255,.08);--card-hi:rgba(255,255,255,.06);--card-sh:0 8px 22px rgba(0,0,0,.32);
  --pitch:#1f5c37;--pitch2:#1b5331;--chalk:rgba(255,255,255,.6);
  --accent:#ffd43b;--accent-ink:#231a00;--win:#43b06a;--draw:#7d857f;--loss:#e0564b;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.disp{font-family:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif}
.app{max-width:560px;margin:0 auto;padding:0 14px calc(88px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 9px;display:block;border-bottom:1px solid var(--line)}
.club{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;font-size:30px;line-height:.95;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow{display:flex;align-items:center;gap:10px}.hrow .crest{margin:0}.htitle{flex:1;min-width:0}
.hchips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.hchips::-webkit-scrollbar{display:none}
.hc{flex:none;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.hc.hi{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.rec{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rec b{font-family:"Big Shoulders Display",Impact,sans-serif;font-size:24px;font-weight:800}
.rec span{display:block;color:var(--muted);font-size:12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
nav.tabs button{flex:1;background:none;border:0;padding:7px 0 8px;color:var(--muted);font-weight:600;font-size:11px;position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs .ic{width:46px;height:28px;border-radius:14px;display:grid;place-items:center;transition:background .2s,color .2s}
nav.tabs .ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on .ic{background:color-mix(in srgb,var(--accent) 38%,var(--surface));color:var(--ink)}
nav.tabs button.on{color:var(--ink)}
nav.tabs button:active .ic{transform:scale(.92)}
nav.tabs button.on{color:var(--ink)}

h2{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;font-size:24px;line-height:1.05;margin:20px 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.btn{display:block;width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:16px;margin-top:10px}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--loss);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=text],input[type=password],textarea{width:100%;font:16px Figtree,system-ui,sans-serif;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:90px;font-size:13px;word-break:break-all}
label.lb{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
/* grade */
.grade{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.gl{font:900 60px/.85 "Big Shoulders Display",Impact,sans-serif;min-width:64px;text-align:center}
.gstats{flex:1;display:grid;gap:5px;font-size:13px}
.bar{display:grid;grid-template-columns:34px 1fr 26px;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.bar i{display:block;height:7px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i b{display:block;height:100%;background:var(--ink);border-radius:4px}
/* pitch */
.pitch{position:relative;aspect-ratio:68/94;border-radius:16px;margin:12px 0 4px;overflow:hidden;
  background:repeating-linear-gradient(0deg,var(--pitch) 0 9.09%,var(--pitch2) 9.09% 18.18%)}
.mk{position:absolute;border:2px solid var(--chalk);pointer-events:none}
.tok{position:absolute;transform:translate(-50%,-50%);width:76px;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;color:#fff}
.disc{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 19px "Big Shoulders Display",Impact,sans-serif;
  background:linear-gradient(135deg,var(--tc) 50%,var(--tc2) 50%);border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.28);text-shadow:0 1px 2px rgba(0,0,0,.7)}
.tok.empty .disc{background:rgba(255,255,255,.12);border:2px dashed rgba(255,255,255,.85);font-size:15px;box-shadow:none}
.nm{margin-top:3px;font-weight:700;font-size:12px;background:rgba(0,0,0,.5);padding:1px 6px;border-radius:6px;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spn{font-size:10px;font-weight:500;max-width:76px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.inj{position:absolute;top:-4px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--loss);color:#fff;font:700 13px/18px Figtree;text-align:center;text-shadow:none}
.leg{position:absolute;bottom:-4px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:800 11px/18px Figtree;text-align:center;text-shadow:none}
.bench{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bslot{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.bslot.empty{border-style:dashed;color:var(--muted);font-size:13px}
.bslot .disc{width:34px;height:34px;font-size:15px;color:#fff}
.bslot .n1{font-size:11px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* type chips */
.ty{display:inline-block;font-weight:700;font-size:10px;padding:1px 6px;border-radius:5px;background:var(--c);color:#fff;margin-right:3px;vertical-align:1px}
.ty.dk{color:#1b1b1b}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--surface2);border:1px solid var(--line);margin-right:3px}
.tag.fit{background:var(--win);color:#fff;border-color:transparent}
.tag.lg{background:var(--accent);color:var(--accent-ink);border-color:transparent}
/* sheets */
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--surface);width:100%;max-width:560px;max-height:90vh;max-height:90dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sh{animation:none}}
.shh{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.shh h3{margin:0;font:800 24px/1 "Big Shoulders Display",Impact,sans-serif}
.x{background:var(--surface2);border:1px solid var(--line);border-radius:999px;width:34px;height:34px;font-size:18px;line-height:1;flex:none}
.shb{overflow:auto;padding:10px 16px 18px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 2px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.row:disabled{opacity:.4}
.row .mid{flex:1;min-width:0}
.row .t1{font-weight:700}
.rt{font:800 26px "Big Shoulders Display",Impact,sans-serif;min-width:40px;text-align:right}
.offers{display:grid;gap:10px}
.offer{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.offer .disc{color:#fff}
.attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.attrs div{background:var(--surface2);border-radius:10px;padding:8px;text-align:center}
.attrs b{display:block;font:800 22px "Big Shoulders Display",Impact,sans-serif}
.attrs span{font-size:12px;color:var(--muted)}
.mv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mv button{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 2px;font-size:12px;font-weight:600}
/* results */
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;text-align:center}
.score .tm{font-weight:700;font-size:15px}
.score .big{font:900 44px/1 "Big Shoulders Display",Impact,sans-serif;font-variant-numeric:tabular-nums}
.scr{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}
.res{display:grid;grid-template-columns:34px 1fr auto 26px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.wdl{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px}
.W{background:var(--win)}.D{background:var(--draw)}.L{background:var(--loss)}
.form{display:flex;gap:4px}
.tblw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--muted);text-align:right;padding:6px 4px;font-size:12px}
td{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){text-align:left}
td:first-child,th:first-child{text-align:left;width:26px;color:var(--muted)}
tr.me td{background:color-mix(in srgb,var(--accent) 28%,transparent);font-weight:700}
tr.me td:first-child{color:var(--ink)}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.trophy{font:900 64px/1 "Big Shoulders Display",Impact,sans-serif}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:30;max-width:90vw;text-align:center}
.setup h1{font:900 64px/.88 "Big Shoulders Display",Impact,sans-serif;margin:30px 0 10px}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px}
.opt.on{border-color:var(--ink)}
.opt b{display:block}
/* spinner + emblems */
.reels{display:grid;grid-template-columns:1fr 1.5fr;gap:8px;margin:4px 0}
.reel{background:var(--surface2);border:2px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;overflow:hidden}
.reel small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.reel b{display:flex;align-items:center;justify-content:center;gap:8px;font:900 32px/1.1 "Big Shoulders Display",Impact,sans-serif;min-height:40px}
.reel.spinning b{animation:tick .08s linear infinite alternate;color:var(--muted)}
.reel.landed{border-color:var(--ink)}
@keyframes tick{from{transform:translateY(-5px)}to{transform:translateY(5px)}}
@media (prefers-reduced-motion:reduce){.reel.spinning b{animation:none}}
.emb{border-radius:50%;display:inline-grid;place-items:center;background:var(--c);flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.emb svg{fill:#fff}
.emb.dk svg{fill:#1b1b1b}
.thm{background:var(--surface2);border:1px solid var(--line);border-radius:999px;min-width:38px;height:38px;padding:0 12px;font-size:15px;font-weight:600;flex:none}
.places{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.places button{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:600;font-size:13px}
.places button b{display:block;font:800 24px "Big Shoulders Display",Impact,sans-serif}
.places button.fit{border-color:var(--win)}
.best{display:grid;grid-template-columns:24px 1fr auto;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;text-align:left}
.disc .spr{width:118%;height:118%;object-fit:contain;image-rendering:pixelated;margin-top:-5px}
.disc .rb{position:absolute;bottom:-5px;left:-8px;min-width:22px;height:18px;padding:0 3px;border-radius:9px;background:rgba(10,20,14,.85);color:#fff;font:800 13px/18px "Big Shoulders Display",Impact,sans-serif;text-align:center}
img.spr{image-rendering:pixelated;object-fit:contain;flex:none}
.feed{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.turn{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 12px;font-weight:700;margin-bottom:10px;display:inline-block}
/* match centre */
.mc-sum{font-size:15px;line-height:1.5;margin:12px 0 4px}
.srow{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;font-variant-numeric:tabular-nums;margin-top:10px;font-size:14px}
.srow span{text-align:center;color:var(--muted);font-size:13px}
.srow b:last-child{text-align:right}
.sbar{display:flex;gap:3px;height:6px;margin-top:4px}
.sbar i{display:block;height:100%;border-radius:3px;min-width:3px}
.tl{display:grid;grid-template-columns:38px 22px 1fr;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.tl.away{grid-template-columns:1fr 22px 38px;text-align:right}
.tl .mn{color:var(--muted);font-variant-numeric:tabular-nums}
.ci{display:inline-block;width:11px;height:15px;border-radius:2px;vertical-align:-2px}
.ci.y{background:#f2c418}.ci.r{background:#d93a2f}
.ico{display:grid;place-items:center;font-size:14px}
.pr{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.rate{min-width:38px;text-align:center;border-radius:7px;padding:2px 0;font:800 16px "Big Shoulders Display",Impact,sans-serif;color:#fff}
.r9{background:#1f8a4c}.r8{background:#3aa35e}.r7{background:#7fae3a}.r6{background:#c79a1d}.r5{background:#c8572d}
.motm{display:inline-block;font-size:10px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:1px 5px;margin-left:4px;vertical-align:1px}
.mcbtn{display:inline-block;margin-top:10px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.stgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stgrid div{background:var(--surface2);border-radius:10px;padding:9px 6px;text-align:center}
.stgrid b{display:block;font:800 22px "Big Shoulders Display",Impact,sans-serif}
.stgrid span{font-size:12px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;padding:8px 0}
.tag.ab{background:color-mix(in srgb,var(--accent) 22%,var(--surface2));}
.tag.pot{color:#c9971a;letter-spacing:-1px}
.crest{vertical-align:middle;flex:none;margin-right:5px}
.clubpick{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}
.clubpick.on{border-color:var(--ink)}
.typegrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.typegrid button{background:var(--surface2);border:2px solid transparent;border-radius:10px;padding:6px 0;display:grid;place-items:center}
.typegrid button.on{border-color:var(--ink)}
.symrow{display:flex;gap:8px}
.symrow button{background:var(--surface2);border:2px solid transparent;border-radius:12px;padding:6px 10px}
.symrow button.on{border-color:var(--ink)}
input[type=color]{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);padding:3px}
tr.poz td:first-child,tr.prz td:first-child{box-shadow:inset 3px 0 0 var(--win)}
tr.rlz td:first-child{box-shadow:inset 3px 0 0 var(--loss)}
.liveov{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);overflow:hidden}
.lvtop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%;max-width:560px;gap:8px}
.lvtop .tn{font-weight:700;font-size:15px;display:flex;align-items:center;gap:4px;min-width:0}
.lvtop .tn:last-child{justify-content:flex-end}
.lvsc{text-align:center}.lvsc b{display:block;font:900 36px/1 "Big Shoulders Display",Impact,sans-serif;font-variant-numeric:tabular-nums}
.lvsc span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lvwrap{position:relative;margin:8px 0 6px}.lvwrap canvas{display:block;border-radius:12px}
.lvban{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(10,20,14,.88);color:#fff;padding:12px 18px;border-radius:14px;font:900 28px/1.1 "Big Shoulders Display",Impact,sans-serif;text-align:center;display:none;max-width:90%}
.lvban small{display:block;font:600 14px Figtree,sans-serif;margin-top:4px}
.lvtick{width:100%;max-width:560px;min-height:42px;font-size:14px;line-height:1.45}
.lvtick p{margin:0}.lvtick p+p{color:var(--muted);font-size:13px}
.lvctl{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:100%;max-width:560px;margin-top:6px}

(function(){const bases=["sprites/","pokemon/","sprites/pokemon/",""];
  const tryImg=src=>new Promise(r=>{const im=new Image();im.onload=()=>r(true);im.onerror=()=>r(false);im.src=src;});
  const loadIds=async()=>{if(DEXID&&Object.keys(DEXID).length>400)return true;try{const res=await fetch("https://pokeapi.co/api/v2/pokemon-species?limit=1100");if(!res.ok)return false;
    const j=await res.json(),m={};(j.results||[]).forEach(x=>{const id=+String(x.url).split("/").filter(Boolean).pop();if(id)m[x.name]=id;});
    if(Object.keys(m).length<400)return false;DEXID=m;try{localStorage.setItem("pokefc_dexids",JSON.stringify(m));}catch(e){}return true;}catch(e){return false;}};
  (async()=>{for(const b of bases){if(await tryImg(b+"1.png")){if(await loadIds()){SPR_MODE="num";SPR_BASE=b;SPRITES=true;render();}return;}}
    if(await tryImg("sprites/bulbasaur.png")){SPR_MODE="name";SPRITES=true;render();}})();})();
</script>
</body>
</html>
